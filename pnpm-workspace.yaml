packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
catalog:
  dotenv: ^17.4.2
  zod: ^4.4.3
  typescript: ^6.0.3
  "@types/node": ^22.20.1
  lucide-react: ^1.27.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  sonner: ^2.0.7
  tailwindcss: ^4.3.3
  "@libsql/client": 0.17.4
  libsql: 0.5.29
  "@orpc/server": ^1.14.12
  "@orpc/client": ^1.14.12
  "@orpc/openapi": ^1.14.12
  "@orpc/zod": ^1.14.12
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  alchemy: 0.94.0
  drizzle-orm: ^0.45.2
packageExtensions:
  # Alchemy 0.94.0 omits safe-fetch's runtime undici dependency; exact 7.29.0 avoids the incompatible v8 dispatcher.
  alchemy@0.94.0:
    dependencies:
      undici: 7.29.0
minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.8'
  - '@biomejs/cli-darwin-arm64@2.5.8'
  - '@biomejs/cli-darwin-x64@2.5.8'
  - '@biomejs/cli-linux-arm64-musl@2.5.8'
  - '@biomejs/cli-linux-arm64@2.5.8'
  - '@biomejs/cli-linux-x64-musl@2.5.8'
  - '@biomejs/cli-linux-x64@2.5.8'
  - '@biomejs/cli-win32-arm64@2.5.8'
  - '@biomejs/cli-win32-x64@2.5.8'
